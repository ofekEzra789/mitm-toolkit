# VM4 - Ubuntu Desktop (Victim)
# Requirements: dhclient (NetworkManager is pre-installed on Ubuntu Desktop)
#   sudo apt install isc-dhcp-client
#
# dhcp=dhclient tells NetworkManager to use dhclient as the DHCPv6 backend.
# This allows disabling Rapid Commit (Option 14) via dhclient6.conf.
#
# Place this file at: /etc/NetworkManager/NetworkManager.conf
# Then: sudo systemctl restart NetworkManager

[main]
plugins=ifupdown,keyfile
dhcp=dhclient

[ifupdown]
managed=false

[device]
wifi.scan-rand-mac-address=no
